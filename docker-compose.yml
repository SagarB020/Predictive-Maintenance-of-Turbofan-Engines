services:
  train:
    build: .
    command: ["bash", "pipeline.sh", "FD001"]
    volumes:
      - .:/app

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      train:
        condition: service_completed_successfully

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      train:
        condition: service_completed_successfully
